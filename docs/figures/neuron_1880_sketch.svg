<text x="40" y="63" font-size="48" fill="#1e1e1e" text-anchor="start" font-weight="700">How I rewired neuron 1880</text>
<text x="44" y="116" font-size="23" fill="#1e1e1e" text-anchor="start" font-weight="600">one worker inside a 125M legal QA model, taught to say “not stated in the context”</text>
<text x="750" y="179" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">question + documents</text>
<text x="750" y="274" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">layers 1–6  (unchanged)</text>
<text x="750" y="595" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700"></text>
<text x="515" y="368" font-size="20" fill="#f08c00" text-anchor="start" font-weight="600">LAYER 7 · neuron 1880 of 3,072</text>
<text x="750" y="415" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">the model’s “thought”</text>
<text x="750" y="439" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">768 numbers</text>
<text x="626" y="528" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">EYE 1 · gate row</text>
<text x="626" y="553" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">does the answer</text>
<text x="626" y="578" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">look missing?</text>
<text x="874" y="528" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">EYE 2 · up row</text>
<text x="874" y="553" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">is the reply about</text>
<text x="874" y="578" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">to start?</text>
<text x="750" y="674" font-size="22" fill="#1e1e1e" text-anchor="middle" font-weight="700">×  =  AND</text>
<text x="750" y="764" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">HAND · down column</text>
<text x="750" y="789" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">add a nudge toward</text>
<text x="750" y="814" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">“not stated in the context”</text>
<text x="750" y="924" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">layers 8–12  (unchanged)</text>
<text x="750" y="1026" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="700">“not stated in the context”</text>
<text x="40" y="349" font-size="21" fill="#9c36b5" text-anchor="start" font-weight="600">STEP 1 · pick the worker nobody needs</text>
<text x="40" y="375" font-size="21" fill="#9c36b5" text-anchor="start" font-weight="600">measured all 3,072 workers on ordinary text</text>
<text x="40" y="401" font-size="21" fill="#9c36b5" text-anchor="start" font-weight="600">1880 contributed the least → fired from its old job</text>
<text x="40" y="474" font-size="21" fill="#1971c2" text-anchor="start" font-weight="600">STEP 2 · build eye 1 (gate)</text>
<text x="40" y="500" font-size="21" fill="#1971c2" text-anchor="start" font-weight="600">record the thought on 1000s of training questions</text>
<text x="40" y="526" font-size="21" fill="#1971c2" text-anchor="start" font-weight="600">label each: answer missing / answer present</text>
<text x="40" y="552" font-size="21" fill="#1971c2" text-anchor="start" font-weight="600">logistic regression finds the separating direction</text>
<text x="40" y="578" font-size="21" fill="#1971c2" text-anchor="start" font-weight="600">× sharpness S → a switch, not a dimmer</text>
<text x="40" y="624" font-size="21" fill="#e03131" text-anchor="start" font-weight="600">⚠ it ends up mostly reading keyword overlap,</text>
<text x="40" y="650" font-size="21" fill="#e03131" text-anchor="start" font-weight="600">   not real understanding (0.72 → 0.12)</text>
<text x="40" y="764" font-size="21" fill="#b07d00" text-anchor="start" font-weight="600">STEP 4 · build the hand (down)</text>
<text x="40" y="790" font-size="21" fill="#b07d00" text-anchor="start" font-weight="600">freeze the whole model</text>
<text x="40" y="816" font-size="21" fill="#b07d00" text-anchor="start" font-weight="600">optimise ONLY these 768 numbers (300 steps)</text>
<text x="40" y="842" font-size="21" fill="#b07d00" text-anchor="start" font-weight="600">goal: max chance of “not stated in the context”</text>
<text x="40" y="868" font-size="21" fill="#b07d00" text-anchor="start" font-weight="600">size capped, then ÷ typical firing strength</text>
<text x="1045" y="474" font-size="21" fill="#2f9e44" text-anchor="start" font-weight="600">STEP 3 · build eye 2 (up)</text>
<text x="1045" y="500" font-size="21" fill="#2f9e44" text-anchor="start" font-weight="600">version 1 had no eye 2: it fired mid-text</text>
<text x="1045" y="526" font-size="21" fill="#2f9e44" text-anchor="start" font-weight="600">and made SEC text 1.72% worse</text>
<text x="1045" y="552" font-size="21" fill="#2f9e44" text-anchor="start" font-weight="600">ridge detector: ≈ 1 at the reply start,</text>
<text x="1045" y="578" font-size="21" fill="#2f9e44" text-anchor="start" font-weight="600">≈ 0 in documents, replies and web text</text>
<text x="1045" y="620" font-size="22" fill="#2f9e44" text-anchor="start" font-weight="600">→ forgetting fell to 0.011%</text>
<text x="1045" y="684" font-size="21" fill="#f08c00" text-anchor="start" font-weight="600">reaction = squash(gate score) × up score</text>
<text x="1045" y="710" font-size="21" fill="#f08c00" text-anchor="start" font-weight="600">if either is ≈ 0, the worker stays quiet</text>
<text x="1045" y="736" font-size="21" fill="#f08c00" text-anchor="start" font-weight="600">fires only on: answer missing AND reply starting</text>
<text x="1275" y="828" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">SAFETY GATE</text>
<text x="1275" y="853" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">≤ 25% change per weight matrix</text>
<text x="1275" y="877" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">≤ 5% change to the whole model</text>
<text x="1275" y="902" font-size="20" fill="#1e1e1e" text-anchor="middle" font-weight="700">then held-out tests + the final 2,000-question exam</text>
<text x="40" y="1116" font-size="23" fill="#1e1e1e" text-anchor="start" font-weight="600">changed: 3 × 768 = 2,304 numbers out of 125.8 million (0.002%) · every other number identical</text>
</svg>